<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Các kiểu định dạng khung viền</title>
    <style>
        .outside {
            border: 3px dotted blue;
            border-radius: 15px;
            padding: 20px;
        }

        .middle {
            border: 3px dashed red;
            border-radius: 15px;
            padding: 20px;
        }

        .inner {
            border: 3px solid green;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            font-size: 36px;
        }
    </style>
</head>
<body>
     <div class="outside">

        <div class="middle">

            <div class="inner">
                I am heavily packed
                <p>&lt; DIV &gt;</p>
            </div>

        </div>
    </div>
</body>
</html>
